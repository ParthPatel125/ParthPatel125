<svg xmlns="http://www.w3.org/2000/svg" width="880" height="130" viewBox="0 0 880 130" role="img" aria-label="parth patel. I build apps and websites.">
<title>parth patel</title>
<defs>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0">
<stop offset="0" stop-color="#1a7f37" stop-opacity="0"/>
<stop offset="0.5" stop-color="#1a7f37" stop-opacity="0.9"/>
<stop offset="1" stop-color="#1a7f37" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-240 0; 980 0; 980 0" keyTimes="0; 0.3; 1" dur="4.5s" begin="1s" repeatCount="indefinite"/>
</linearGradient>
<style>
@font-face {
  font-family: 'Archivo Black';
  src: url(data:font/woff2;base64,) format('woff2');
  font-weight: 400;
  font-style: normal;
}
.name, .tag { font-family: 'Archivo Black', 'Arial Black', Arial, sans-serif; }
.name { font-size: 42px; letter-spacing: -1px; }
.tag  { font-size: 18px; letter-spacing: -0.25px; }
.in   { animation: rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) both; }
.d1   { animation-delay: 0.1s; }
.d2   { animation-delay: 0.35s; }
.bar  { transform-origin: 0 0; animation: grow 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
</defs>
<g class="in d1">
<text class="name" x="0" y="52" fill="#1f2328">parth patel</text>
<text class="name" x="0" y="52" fill="url(#shine)">parth patel</text>
</g>
<rect class="bar" x="2" y="66" width="104" height="7" fill="#1a7f37"/>
<text class="tag in d2" x="0" y="108" fill="#59636e">I build apps and websites.</text>
</svg>
